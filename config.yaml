# All pipeline knobs live here. Edit this file, not the code.
seed: 42
hub:
  enabled: true
  private: true
  repo_prefix: ecfr-title12

runtime:
  device: auto   # auto | cuda | mps | cpu
                 #   auto -> CUDA if visible, else Apple Silicon GPU (MPS, M1-M5), else CPU
                 #   CLI override: --device {auto,cuda,mps,cpu}
                 # 4-bit QLoRA (bitsandbytes) is CUDA-only; MPS trains un-quantized
                 # LoRA in bf16/fp16; CPU trains float32 (pair with --smoke).

ecfr:
  date: "2025-01-01"   # point-in-time snapshot; pinning it makes every run reproducible
  title: 12
  chapter: null        # null = whole title (~40 MB); "I" = OCC only, parts 1-199 (~5 MB)

paths:
  data_dir: data
  raw_dir: data/raw
  outputs_dir: outputs
  results_dir: results

model:
  id: meta-llama/Meta-Llama-3.1-8B-Instruct          # gated: requires HF_TOKEN
  fallback_id: NousResearch/Meta-Llama-3.1-8B-Instruct  # ungated mirror, used automatically on auth failure
  smoke_id: HuggingFaceTB/SmolLM2-135M-Instruct      # tiny model for --smoke pipeline validation
  qlora_below_gb: 40   # < this much VRAM -> 4-bit QLoRA; >= -> bf16 LoRA

system_prompt: >-
  You are a banking-regulation assistant specialized in Title 12 of the Code of
  Federal Regulations (12 CFR). Answer accurately, ground your answers in the
  regulation text, and cite the relevant section (for example, 12 CFR § 3.10).

dataset:
  min_section_chars: 200     # drop stubs and cross-reference-only sections
  max_answer_words: 220
  max_definition_words: 80
  dpo_pairs_per_section: 2
  max_eval_examples: 200     # eval costs real money; cap the test set
  split: {train: 8, val: 1, test: 1}   # hash buckets out of 10, assigned per section

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

sft:
  epochs: 2
  learning_rate: 2.0e-4
  per_device_batch: 2
  grad_accum: 8              # effective batch 16
  max_length: 2048
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100

dpo:
  epochs: 1
  learning_rate: 5.0e-6
  beta: 0.1
  per_device_batch: 1
  grad_accum: 8
  max_length: 1536
  max_prompt_length: 768
  warmup_ratio: 0.05
  logging_steps: 10

grpo:
  max_steps: 300
  learning_rate: 1.0e-5
  num_generations: 4         # completions sampled per prompt
  per_device_batch: 4        # must be divisible by num_generations
  grad_accum: 4
  max_prompt_length: 768
  max_completion_length: 260
  beta: 0.0                  # no KL reference model; rewards are verifiable
  temperature: 0.9
  logging_steps: 5

eval:
  max_new_tokens: 256
  batch_size: 8
  checkpoints: [base, sft, dpo, grpo]   # grpo is skipped automatically if never trained

smoke:
  max_steps: 5
  max_train_examples: 64
  max_eval_examples: 8
  eval_batch_size: 4
  max_new_tokens: 32
